[package]
name = "walkie-talkie"
version = "0.3.0"
description = "Dictée vocale vers la fenêtre active sous Linux, inspirée de victorrentea/walkie-talkie"
edition = "2024"

[dependencies]
fontdue = "0.9.4"
hound = "3.5.1"
png = "0.18.1"
tiny-skia = "0.12.0"
whisper-rs = "0.16.0"
x11rb = { version = "0.14.0", features = ["randr", "shape", "xfixes"] }

[features]
cuda = ["whisper-rs/cuda"]
